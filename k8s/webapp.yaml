apiVersion: apps/v1
kind: Deployment
metadata:
  name: cinekube-webapp
  namespace: cinekube
  labels:
    app: cinekube-webapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cinekube-webapp
  template:
    metadata:
      labels:
        app: cinekube-webapp
    spec:
      containers:
      - name: webapp
        image: localhost/cinekube-webapp:local
        imagePullPolicy: IfNotPresent
        ports:
          - containerPort: 3000
        envFrom:
          - secretRef:
              name: cinekube-secrets
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 3
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 20
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: cinekube-webapp-svc
  namespace: cinekube
spec:
  type: NodePort
  selector:
    app: cinekube-webapp
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
      nodePort: 30080
